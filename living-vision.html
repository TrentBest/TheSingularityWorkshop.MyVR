<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b13">
<meta name="description" content="Enter the MyVR living vision: one physical venue, transformed into shared adventures.">
<title>MyVR — The living vision</title>
<style>
:root{color-scheme:dark;--bg:#050b13;--ink:#f4fbff;--muted:#a7bac6;--mint:#77e2c1;--cyan:#8bd8f0;--gold:#f2c879;--line:#ffffff25}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}button,input{font:inherit}button{cursor:pointer;border:1px solid #77e2c180;border-radius:999px;padding:11px 17px;background:#77e2c1;color:#061a18;font-weight:800}button.ghost{background:#ffffff0b;color:var(--ink);border-color:var(--line)}button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}a{color:var(--cyan)}.brand{position:fixed;z-index:10;top:18px;left:24px}.brand img{width:155px;max-width:36vw}.toplinks{position:fixed;z-index:10;top:24px;right:24px;display:flex;gap:16px;font-size:.86rem}.toplinks a{text-decoration:none;color:var(--muted)}
#stage{position:relative;height:100svh;min-height:560px;overflow:hidden;background:radial-gradient(ellipse at 50% 58%,#123345 0,transparent 54%),linear-gradient(145deg,#081522,#03070d 75%)}#stage:before,#stage:after{content:"";position:absolute;inset:-30%;pointer-events:none;background:repeating-linear-gradient(115deg,transparent 0 78px,#8bd8f008 79px 80px);transform:translateX(var(--drift,0));animation:drift 34s linear infinite}#stage:after{background:radial-gradient(circle at 50% 50%,transparent 0 20%,#8bd8f008 20.2% 20.4%,transparent 20.6% 34%,#8bd8f008 34.2% 34.4%,transparent 34.6%);animation:pulse 8s ease-in-out infinite}
@keyframes drift{to{transform:translateX(80px)}}@keyframes pulse{50%{transform:scale(1.12);opacity:.45}}
#scene{position:absolute;inset:0;display:grid;place-items:center;padding:110px 24px 120px;opacity:1;transition:opacity .9s ease,transform 1.1s ease;transform:scale(1)}#scene.fade{opacity:0;transform:scale(.97)}.content{position:relative;z-index:1;width:min(100%,1000px);text-align:center}.act{color:var(--mint);font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;font-weight:900}.headline{font-size:clamp(2.8rem,8vw,7.4rem);line-height:.96;letter-spacing:-.065em;margin:.25em 0}.headline em{font-style:normal;color:var(--mint)}.copy{max-width:66ch;margin:22px auto;color:var(--muted);font-size:clamp(1rem,2vw,1.2rem)}.visual{margin:34px auto 0;max-width:760px;min-height:120px;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}.node{border:1px solid #77e2c170;background:linear-gradient(145deg,#163747aa,#0a1826dd);padding:18px 22px;border-radius:16px;min-width:130px;box-shadow:0 20px 60px #0005}.node b{display:block;color:var(--mint);font-size:1.05rem}.node small{color:var(--muted)}.arrow{color:var(--gold);font-size:1.7rem}.arena{width:min(82vw,640px);aspect-ratio:16/7;border:2px solid #77e2c180;border-radius:22px;position:relative;background:linear-gradient(90deg,#8bd8f018 1px,transparent 1px),linear-gradient(#8bd8f018 1px,transparent 1px);background-size:32px 32px;box-shadow:inset 0 0 70px #77e2c115,0 0 80px #8bd8f018}.zone{position:absolute;border:1px solid #77e2c1aa;border-radius:10px;background:#77e2c11c}.z1{left:6%;top:13%;width:22%;height:30%}.z2{right:6%;top:13%;width:22%;height:30%}.z3{left:6%;bottom:13%;width:22%;height:30%}.z4{right:6%;bottom:13%;width:22%;height:30%}.core{position:absolute;left:40%;top:35%;width:20%;height:30%;border:1px solid var(--gold);border-radius:50%;box-shadow:0 0 35px #f2c87988}.beam{position:absolute;left:28%;right:28%;top:50%;height:2px;background:var(--mint);box-shadow:0 0 20px var(--mint)}.orbit{width:190px;height:190px;border:1px solid #77e2c160;border-radius:50%;position:relative;animation:spin 18s linear infinite}.orbit:before,.orbit:after{content:"";position:absolute;width:12px;height:12px;background:var(--mint);border-radius:50%;top:20px;left:35px;box-shadow:0 0 22px var(--mint)}.orbit:after{top:auto;left:auto;right:20px;bottom:40px;background:var(--gold);box-shadow:0 0 22px var(--gold)}@keyframes spin{to{transform:rotate(360deg)}}
.controls{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:15px 22px max(15px,env(safe-area-inset-bottom));background:linear-gradient(0deg,#03070df2,#03070d00);display:flex;align-items:center;justify-content:space-between;gap:14px}.controlgroup{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.progress{height:3px;position:fixed;z-index:21;bottom:0;left:0;right:0;background:#ffffff18}.progress span{display:block;height:100%;width:0;background:var(--mint);transition:width .5s}.rate{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.82rem}.rate input{width:70px;background:#081521;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:7px}.status{color:var(--muted);font-size:.82rem;min-width:110px}
#child{position:fixed;z-index:30;inset:0;background:radial-gradient(ellipse at 50% 0,#194357,#07111c 65%);display:none;overflow:auto;padding:90px 22px 35px}#child.open{display:block;animation:arrive .5s ease}@keyframes arrive{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}.childwrap{width:min(100%,1000px);margin:auto}.childhead{display:flex;justify-content:space-between;align-items:center;gap:18px}.childtitle{font-size:clamp(2.2rem,5vw,4.3rem);line-height:1.02;letter-spacing:-.05em}.childlead{color:var(--muted);max-width:70ch}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.tile{border:1px solid var(--line);background:#ffffff08;border-radius:16px;padding:20px}.tile h3{color:var(--mint);margin:.2em 0}.tile p{color:var(--muted);font-size:.93rem}.switches{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.meter{height:12px;border-radius:99px;background:#ffffff18;overflow:hidden;margin:14px 0}.meter span{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .4s}.allocation{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.allocation div{padding:14px;border:1px solid var(--line);border-radius:12px;background:#ffffff08}.allocation strong{display:block;color:var(--mint)}.footnote{font-size:.82rem;color:var(--muted)}.keyhint{color:#8298a5;font-size:.75rem}
@media(max-width:700px){.toplinks{display:none}.brand{top:12px;left:14px}.brand img{width:125px}#scene{padding:90px 18px 135px}.headline{font-size:clamp(2.65rem,13vw,5rem)}.controls{align-items:flex-start;flex-direction:column;padding-inline:14px}.controlgroup{width:100%;justify-content:space-between}.tiles{grid-template-columns:1fr}.allocation{grid-template-columns:1fr 1fr}.status{display:none}.rate{margin-left:auto}.node{min-width:100px;padding:12px}.visual{gap:6px}.arrow{font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.workshop-footer{position:fixed;z-index:9;right:22px;bottom:76px;opacity:.72;pointer-events:none}.workshop-footer img{display:block;width:112px;max-width:24vw;height:auto}@media(max-width:700px){.workshop-footer{right:12px;bottom:132px}.workshop-footer img{width:86px}}</style>
</head>
<body>
<a class="brand" href="index.html" aria-label="MyVR home"><img src="https://raw.githubusercontent.com/TrentBest/TheSingularityWorkshop.Visualize/development/docs/assets/moniker.svg" alt="The Singularity Workshop"></a>
<nav class="toplinks"><a href="index.html">MyVR</a><a href="business-model.html">Economics</a><a href="competition.html">Research</a></nav>
<main id="stage" aria-live="off"><div id="scene"><div class="content" id="content"></div></div></main>
<section id="child" aria-modal="true" role="dialog" aria-labelledby="child-title"><div class="childwrap" id="child-content"></div></section>
<div class="controls" aria-label="Presentation controls">
 <div class="controlgroup"><button class="ghost" id="previous" aria-label="Previous act">← Back</button><button id="next">Next beat →</button><button class="ghost" id="pause">Pause</button><span class="status" id="status" aria-live="polite">Act I · 1 of 8</span></div>
 <div class="controlgroup"><label class="rate">Seconds per beat <input id="rate" type="number" min="4" max="90" step="1" value="12" aria-label="Seconds per beat"></label><button class="ghost" id="restart">Restart</button></div>
</div><div class="progress"><span id="bar"></span></div>
<footer class="workshop-footer" aria-label="The Singularity Workshop"><img src="https://raw.githubusercontent.com/TrentBest/FSM_API/master/Documentation/Branding/TheSingularityWorkshop.png" alt="The Singularity Workshop"></footer>
<script>
(()=>{
"use strict";
const $=id=>document.getElementById(id);
const beats=[
 {act:"Act I · The familiar world",title:"You already have<br><em>the arena.</em>",copy:"Friends arrive together. Teams form. The countdown begins. Your venue already knows how to bring people together.",visual:'<div class="arena"><i class="zone z1"></i><i class="zone z2"></i><i class="zone z3"></i><i class="zone z4"></i><i class="core"></i><i class="beam"></i></div>'},
 {act:"Act I · The question",title:"What if the room<br>could become <em>many worlds?</em>",copy:"Now imagine that same room becoming somewhere else entirely—without asking everyone to go somewhere else.",visual:'<div class="orbit"></div><div class="node"><b>One place</b><small>many possibilities</small></div>'},
 {act:"Act II · The transformation",title:"The walls stay real.<br><em>The world changes.</em>",copy:"A warning flashes. The reactor is failing. Then, another night, the same walls become an alien frontier. The room stays. The adventure changes.",visual:'<div class="node"><b>PHYSICAL SPACE</b><small>routes · boundaries · safety</small></div><span class="arrow">+</span><div class="node"><b>EXPERIENCE</b><small>story · rules · objectives</small></div><span class="arrow">→</span><div class="node"><b>NEW WORLD</b><small>shared play</small></div>'},
 {act:"Act II · The ecosystem",title:"One world is only<br><em>the beginning.</em>",copy:"New adventures can keep arriving. Creators imagine them. Venues bring them to life. Players give each one its own story.",visual:'<div class="node"><b>CREATORS</b><small>author experiences</small></div><span class="arrow">→</span><div class="node"><b>PLATFORM</b><small>distribute + orchestrate</small></div><span class="arrow">→</span><div class="node"><b>VENUES</b><small>host real groups</small></div>'},
 {act:"Act III · The operating model",title:"A network of venues.<br><em>One coherent platform.</em>",copy:"Behind every seamless adventure is a team: the people who know the venue, the creators who shape the worlds, and the platform that connects them.",visual:'<div class="node"><b>WORKSHOP</b><small>core platform</small></div><span class="arrow">↓</span><div class="node"><b>DISTRIBUTOR</b><small>local relationships</small></div><span class="arrow">↓</span><div class="node"><b>VENUE NETWORK</b><small>separate tenants</small></div>'},
 {act:"Act III · The economics",title:"A world worth building<br><em>is built together.</em>",copy:"A lasting world needs a healthy ecosystem—one where the venue, local partners, creators, and platform can all keep contributing.",visual:'<div class="allocation"><div><strong>Venue</strong><small>local operation</small></div><div><strong>Distributor</strong><small>sales + service</small></div><div><strong>Creator</strong><small>licensed work</small></div><div><strong>Workshop</strong><small>platform + tools</small></div></div>'},
 {act:"Act IV · The proof",title:"One venue.<br><em>One first adventure.</em>",copy:"The first step is wonderfully simple: one venue, one unforgettable experience, and real people in the room. Then learn what deserves to come next.",visual:'<div class="node"><b>ONE VENUE</b><small>baseline + supervised pilot</small></div><span class="arrow">→</span><div class="node"><b>REPEAT</b><small>second deployment</small></div><span class="arrow">→</span><div class="node"><b>EVIDENCE</b><small>measured outcomes</small></div>'},
 {act:"Act IV · The invitation",title:"Don't just read<br>about <em>the future.</em>",copy:"The room is ready. The next world is waiting. Take a closer look.",visual:'<div class="orbit"></div><div class="node"><b>THE NEXT WORLD</b><small>is yours to explore</small></div>',final:true}
];
const childViews={
 roles:{title:"Choose your vantage point",lead:"Step out of the film and into one part of the world behind it. The main story will be waiting when you return.",tiles:[["Venue operator","Turn an existing space into more bookable formats, with staff workflow and safety at the center."],["Distributor","Build a local customer network through installation, training, deployment, and first-line support."],["Creator","Author reusable experiences and define licensing, maintenance, and attribution."],["Workshop","Steward core technology, platform operations, release controls, and ecosystem sustainability."]]},
 architecture:{title:"A world, assembled from responsibilities",lead:"The canonical Experience owns authored meaning. MyVR presents the participant's view. Visualize owns visual execution. The venue supplies physical truth.",tiles:[["Experience","World identity, mission rules, shared entities, authored content."],["MyVR","Device capabilities, participant interaction, local view, session participation."],["Visualize","Pixels, rendering, visual resources, and presentation backends."],["Venue","Physical layout, boundaries, equipment, staff procedures, safety."]]},
 economics:{title:"Explore the ecosystem",lead:"Illustrative only. These sliders show how a single attributable-gross pool could be divided. They are not agreed prices or signed partner terms.",tiles:[["Venue residual","The portion retained by the venue after the defined allocation."],["Distributor","Compensates local sales, installation, training, and support."],["Creator","Compensates licensed or commissioned experience supply."],["Workshop","Funds platform stewardship and ongoing development."]]}
};
let parentIndex=0,paused=false,child=null,childState=null,timer=null,rate=12,started=false;
const reduced=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function render(){
 const b=beats[parentIndex],scene=$("scene");$("content").innerHTML='<div class="act">'+b.act+'</div><h1 class="headline">'+b.title+'</h1><p class="copy">'+b.copy+'</p><div class="visual">'+b.visual+'</div>'+(b.final?'<div class="switches" style="justify-content:center"><button data-child="roles">Explore a role</button><button class="ghost" data-child="architecture">Explore the architecture</button><button class="ghost" data-child="economics">Explore the economics</button></div>':'');
 $("content").querySelectorAll("[data-child]").forEach(x=>x.addEventListener("click",()=>enterChild(x.dataset.child)));
 $("status").textContent=b.act+" · "+(parentIndex+1)+" of "+beats.length;$("bar").style.width=((parentIndex+1)/beats.length*100)+"%";
 $("previous").disabled=parentIndex===0;$("next").textContent=parentIndex===beats.length-1?"Explore":"Next beat →";
}
function clearTimer(){if(timer){clearTimeout(timer);timer=null}}
function schedule(){clearTimer();if(paused||child||parentIndex===beats.length-1)return;timer=setTimeout(()=>advance(1),rate*1000)}
function advance(delta){if(child)return;const next=Math.max(0,Math.min(beats.length-1,parentIndex+delta));if(next===parentIndex){if(parentIndex===beats.length-1)enterChild("roles");return}clearTimer();const scene=$("scene");scene.classList.add("fade");setTimeout(()=>{parentIndex=next;render();scene.classList.remove("fade");schedule()},reduced?0:850)}
function setPaused(value){paused=value;clearTimer();$("pause").textContent=paused?"Resume":"Pause";$("pause").setAttribute("aria-pressed",String(paused));if(!paused)schedule()}
function enterChild(name){clearTimer();child=name;childState={page:0,allocation:[55,15,10,20]};$("child").classList.add("open");$("child").setAttribute("aria-hidden","false");document.body.style.overflow="auto";renderChild();$("child").scrollTop=0}
function renderChild(){
 const view=childViews[child],tiles=view.tiles.map((t,i)=>'<article class="tile"><h3>'+t[0]+'</h3><p>'+t[1]+'</p></article>').join("");
 let extra="";
 if(child==="economics")extra='<div class="tile"><h3>Adjust the illustrative allocation</h3><div class="allocation" id="allocation"></div><div class="meter"><span id="allocation-meter" style="--w:100%"></span></div><p id="allocation-total" aria-live="polite"></p><div class="switches"><button class="ghost" data-reset-split>Reset example</button></div><p class="footnote">The example starts at 55% venue, 15% distributor, 10% creator, and 20% Workshop. This is a visualization, not a proposed contract.</p></div>';
 $("child-content").innerHTML='<div class="childhead"><span class="act">Nested FSM · '+child+'</span><button class="ghost" id="exit-child">← Return to presentation</button></div><h2 class="childtitle" id="child-title">'+view.title+'</h2><p class="childlead">'+view.lead+'</p><div class="tiles">'+tiles+'</div>'+extra+'<p class="keyhint">Parent state preserved: '+beats[parentIndex].act+'. Returning resumes this exact beat; the presentation timer restarts only after you return.</p>';
 $("exit-child").addEventListener("click",exitChild);
 if(child==="economics")renderAllocation();
}
function renderAllocation(){
 const names=["Venue","Distributor","Creator","Workshop"],wrap=$("allocation");wrap.innerHTML="";
 names.forEach((name,i)=>{const d=document.createElement("div");d.innerHTML='<strong>'+name+'</strong><label><input type="range" min="0" max="100" value="'+childState.allocation[i]+'" data-share="'+i+'" aria-label="'+name+' share"> <output>'+childState.allocation[i]+'%</output></label>';wrap.appendChild(d)});
 wrap.querySelectorAll("input").forEach(input=>input.addEventListener("input",()=>{const i=Number(input.dataset.share),others=childState.allocation.reduce((s,v,j)=>s+(j===i?0:v),0);childState.allocation[i]=Math.min(Number(input.value),100-others);renderAllocation()}));
 const total=childState.allocation.reduce((a,b)=>a+b,0);$("allocation-meter").style.setProperty("--w",total+"%");$("allocation-total").textContent="Allocated: "+total+"% · Unallocated: "+(100-total)+"%";
 $("child-content").querySelector("[data-reset-split]")?.addEventListener("click",()=>{childState.allocation=[55,15,10,20];renderAllocation()});
}
function exitChild(){$("child").classList.remove("open");$("child").setAttribute("aria-hidden","true");document.body.style.overflow="hidden";child=null;childState=null;schedule();$("next").focus()}
$("next").addEventListener("click",()=>advance(1));$("previous").addEventListener("click",()=>advance(-1));$("pause").addEventListener("click",()=>setPaused(!paused));$("restart").addEventListener("click",()=>{exitChildIfNeeded();parentIndex=0;setPaused(false);render();schedule()});
function exitChildIfNeeded(){if(child){$("child").classList.remove("open");$("child").setAttribute("aria-hidden","true");child=null;childState=null;document.body.style.overflow="hidden"}}
$("rate").addEventListener("change",e=>{rate=Math.max(4,Math.min(90,Number(e.target.value)||12));e.target.value=rate;schedule()});
document.addEventListener("keydown",e=>{if(child){if(e.key==="Escape"){exitChild();e.preventDefault()}return}if(e.target.matches("input,button"))return;if(e.key==="ArrowRight"){advance(1)}else if(e.key==="ArrowLeft"){advance(-1)}else if(e.key===" "){setPaused(!paused);e.preventDefault()}});
render();schedule();
})();
</script>
</body>
</html>
