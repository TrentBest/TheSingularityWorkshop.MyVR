name: Validate MyVR business site

on:
  pull_request:
    branches:
      - development
    paths:
      - "index.html"
      - "business-model.html"
      - "competition.html"
      - "living-vision.html"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read

concurrency:
  group: myvr-business-site-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site files (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Verify required pages exist and are non-empty
        shell: bash
        run: |
          set -euo pipefail
          for page in index.html business-model.html competition.html living-vision.html; do
            test -s "$page" || {
              echo "::error::Required page is missing or empty: $page"
              exit 1
            }
          done
          echo "All required static site pages are present."
