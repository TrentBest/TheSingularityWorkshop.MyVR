name: MyVR CI

on:
  push:
    branches:
      - development
      - 'feature/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore tests/MyVR.Core.Tests/MyVR.Core.Tests.csproj

      - name: Build
        run: dotnet build tests/MyVR.Core.Tests/MyVR.Core.Tests.csproj --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/MyVR.Core.Tests/MyVR.Core.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=myvr-tests.trx"
